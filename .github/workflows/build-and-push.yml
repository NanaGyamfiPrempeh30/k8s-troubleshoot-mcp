name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: docker.io/yawgyamfiprem32/k8s-troubleshoot-mcp
  # Must match `name` in server.json. The MCP Registry verifies ownership by
  # comparing the image's io.modelcontextprotocol.server.name annotation to
  # this value, so a drift between Dockerfile and server.json is a failed
  # publish. The smoke-test job asserts all three agree.
  MCP_SERVER_NAME: io.github.nanagyamfiprempeh30/k8s-troubleshoot-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Runs before the build so a transposed namespace costs no build minutes.
      # The other identity checks in this job compare values to *each other*
      # (server.json's identifier against IMAGE_NAME, the image label against
      # MCP_SERVER_NAME) and therefore pass when both sides are wrong in the
      # same direction — which is how the GitHub handle ended up in every
      # docker.io path here, agreeing with itself, until a manual grep found it.
      # This step pins the literal namespaces, so agreement is not sufficient.
      - name: Verify GitHub and Docker Hub namespaces are not transposed
        run: python3 scripts/check-namespaces.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read version from pyproject.toml
        id: version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "could not parse version from pyproject.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}

      # Single-arch build loaded into the local daemon so the smoke tests can
      # actually run it. The multi-arch push below reuses the same cache.
      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the package imports and the app builds
        run: |
          docker run --rm --entrypoint python ${{ env.IMAGE_NAME }}:test \
            -c "from k8s_troubleshoot_mcp.server import create_app; print('OK')"

      # REQ-001 / REQ-003: no KUBECONFIG means refuse to start, not fall back to
      # an ambient credential. Asserted here because this is the one property a
      # broken image could violate without any test noticing — the unit suite
      # exercises validate_env() in-process, never the packaged entrypoint.
      - name: Smoke test — fails closed without a kubeconfig
        run: |
          set +e
          out=$(docker run --rm ${{ env.IMAGE_NAME }}:test 2>/tmp/err)
          code=$?
          set -e
          err=$(cat /tmp/err)

          test "$code" -eq 1 || { echo "expected exit 1, got $code"; exit 1; }
          test -z "$out" || { echo "stdout must stay empty (REQ-010), got: $out"; exit 1; }
          case "$err" in
            *"KUBECONFIG environment variable is not set"*) ;;
            *) echo "unexpected stderr: $err"; exit 1 ;;
          esac
          echo "OK — exits 1, diagnoses on stderr, stdout clean"

      - name: Smoke test — runs as non-root UID 10001
        run: |
          uid=$(docker run --rm --entrypoint id ${{ env.IMAGE_NAME }}:test -u)
          test "$uid" = "10001" || { echo "expected UID 10001, got $uid"; exit 1; }
          echo "OK — UID $uid"

      # The registry rejects a publish whose image annotation disagrees with
      # server.json. Catching that here beats discovering it at publish time.
      - name: Verify MCP Registry annotation matches server.json
        run: |
          label=$(docker image inspect ${{ env.IMAGE_NAME }}:test \
            --format '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}')
          declared=$(python3 -c "import json;print(json.load(open('server.json'))['name'])")

          test "$label" = "${{ env.MCP_SERVER_NAME }}" || {
            echo "Dockerfile label '$label' != workflow MCP_SERVER_NAME"; exit 1; }
          test "$declared" = "${{ env.MCP_SERVER_NAME }}" || {
            echo "server.json name '$declared' != workflow MCP_SERVER_NAME"; exit 1; }
          echo "OK — $label"

      # server.json pins an exact image tag. If it drifts from the version being
      # built, the registry listing points at an image that does not exist.
      - name: Verify server.json pins the version being built
        run: |
          identifier=$(python3 -c "import json;print(json.load(open('server.json'))['packages'][0]['identifier'])")
          expected="${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          test "$identifier" = "$expected" || {
            echo "server.json pins '$identifier' but this build produces '$expected'"; exit 1; }
          echo "OK — $identifier"

      # Validates against the live schema rather than a vendored copy, so a
      # registry schema change surfaces here instead of at publish time. The
      # schema is stricter than the published examples suggest — `description`
      # is capped at 100 characters, which a plausible-looking value exceeds
      # without any other signal.
      - name: Validate server.json against the MCP Registry schema
        run: |
          schema_url=$(python3 -c "import json;print(json.load(open('server.json'))['\$schema'])")
          curl -sSf -o /tmp/server.schema.json "$schema_url"
          pip install --quiet jsonschema
          python3 - <<'PY'
          import json, sys, jsonschema
          schema = json.load(open("/tmp/server.schema.json"))
          doc = json.load(open("server.json"))
          errors = sorted(jsonschema.Draft7Validator(schema).iter_errors(doc),
                          key=lambda e: list(e.path))
          for e in errors:
              print(f"server.json{list(e.path)}: {e.message}", file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY
          echo "OK — server.json is valid"

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The registry reads the annotation from the image index for
          # multi-arch pushes, not only from the per-platform manifests.
          annotations: |
            index:io.modelcontextprotocol.server.name=${{ env.MCP_SERVER_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: yawgyamfiprem32/k8s-troubleshoot-mcp
          short-description: "Read-only MCP server for Kubernetes cluster diagnostics"
          readme-filepath: ./docs/dockerhub-overview.md
