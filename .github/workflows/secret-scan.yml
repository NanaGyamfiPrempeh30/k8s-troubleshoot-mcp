# .github/workflows/secret-scan.yml
# Scans commits for accidentally committed secrets (tokens, keys, passwords).
# TruffleHog checks known secret patterns and entropy.
#
# The pre-commit hook catches secrets locally; this workflow is the safety net
# for a push from a machine without the hook configured, or one made with
# --no-verify.
#
# Highest-value target in this repository: a generated kubeconfig, which carries
# a live ServiceAccount bearer token for the cluster.

name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for scanning commit diffs

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
