# REQ-011: the identity the server authenticates as.
#
# Apply after namespace.yaml — the namespace must exist first.
#
# automountServiceAccountToken is false deliberately. The server never uses
# in-cluster configuration (REQ-003: explicit kubeconfig path only, no fallback
# chain), so it has no use for a projected token mounted into a pod. Any pod
# that later adopts this ServiceAccount gets no ambient credential either,
# which keeps the only path to these permissions the explicit kubeconfig that
# scripts/generate-kubeconfig.sh produces.
#
# That script creates a Kubernetes 1.24+ style token via TokenRequest rather
# than relying on a legacy auto-generated Secret (REQ-014), so nothing here
# depends on the automount behaviour.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-server
  namespace: k8s-mcp
  labels:
    app.kubernetes.io/name: k8s-troubleshoot-mcp
    app.kubernetes.io/component: rbac
automountServiceAccountToken: false
